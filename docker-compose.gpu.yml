# Optional GPU overlay for NVIDIA (Docker Desktop + WSL2 + NVIDIA Container Toolkit).
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# Requires: nvidia-smi works on the host, and Docker Desktop → Settings → Resources
# → enable GPU / WSL integration.
services:
  ollama:
    gpus: all
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-1}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-30m}
