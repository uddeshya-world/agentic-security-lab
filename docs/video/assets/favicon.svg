<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Favicon variant of mark.svg. A tab icon renders at 16px, where three
    graduated pips turn to mush, so this drops to two and thickens the bar.
    Colours are literal here on purpose: a favicon is composited by the
    browser outside the page, so it cannot inherit the theme.
  -->
  <rect width="32" height="32" rx="7" fill="#0a0c10"/>
  <circle cx="9"  cy="16" r="2.4" fill="#ff6b35" opacity=".55"/>
  <circle cx="17" cy="16" r="3.6" fill="#ff6b35"/>
  <rect x="24" y="6" width="4" height="20" rx="2" fill="#35e0c0"/>
</svg>
