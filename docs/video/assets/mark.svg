<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="CyberRange">
  <!--
    The mark is the product's one sentence: a compromise propagates, and
    something stops it. Three ember pips travel left to right, each larger
    than the last, and the halon bar is where the travel ends. Nothing here
    is decorative — remove the bar and the mark means the opposite thing.

    Colour comes from the page: `fill` is inherited so the mark sits correctly
    in both themes. Set `color` on the <svg> (or a parent) to tint the pips;
    the bar carries its own class so a stylesheet can point it at --halon.
  -->
  <g class="pips" fill="currentColor">
    <circle cx="4"  cy="16" r="1.6" opacity=".45"/>
    <circle cx="11" cy="16" r="2.4" opacity=".7"/>
    <circle cx="18" cy="16" r="3.2"/>
  </g>
  <rect class="stop" x="25" y="5" width="3" height="22" rx="1.5" fill="currentColor" opacity=".9"/>
</svg>
